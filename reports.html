<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | Attendance System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-shell">
  <nav class="sidebar">
    <a class="side-brand" href="dashboard.html">
      <span class="brand-mark">SA</span>
      <span>Attendance<br>System</span>
    </a>
    <div class="nav">
      <a data-page="dashboard" href="dashboard.html">⌂ Dashboard</a>
      <a data-page="students" href="students.html">👨‍🎓 Students</a>
      <a data-page="classes" href="classes.html">📚 Classes</a>
      <a data-page="attendance" href="attendance.html">✓ Attendance</a>
      <a data-page="reports" href="reports.html" class="active">▤ Reports</a>
      <a data-page="settings" href="settings.html">⚙ Settings</a>
      <a href="index.html">↩ Home</a>
    </div>
    <div class="side-user">
      <span class="avatar">AD</span>
      <div>
        <b id="sideUserName">Administrator</b>
        <small id="sideUserRole">Admin</small>
      </div>
    </div>
  </nav>

  <div class="app-main">
    <header class="app-top">
      <span id="mobileTitle" class="brand dark">Attendance System</span>
      <span></span>
      <div class="top-actions">
        <span id="liveDate"></span>
        <button id="logoutBtn" class="btn outline small">Logout</button>
      </div>
    </header>

    <main class="content">
      <div class="page-heading">
        <div>
          <span class="eyebrow">ANALYTICS</span>
          <h1>Reports</h1>
          <p>Attendance performance per student.</p>
        </div>
      </div>

      <section class="panel">
        <div class="toolbar">
          <input id="reportSearch" class="search" type="search" placeholder="Search students…">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Student</th>
                <th>Reg. No.</th>
                <th>Course</th>
                <th>Present</th>
                <th>Late</th>
                <th>Absent</th>
                <th>Rate</th>
              </tr>
            </thead>
            <tbody id="reportsTable">
              <tr><td colspan="7" class="loading">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
